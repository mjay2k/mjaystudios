  if (!t) return;
  if (t.hasAttribute('data-scrim') && e.target !== t) return;
  if (t.hasAttribute('data-close') || t.hasAttribute('data-scrim')) return void closeModal();

  /* ---- loadout simulator ---- */
  if (t.dataset.simcls){
    if (SIM) simStop();
    S.sim.cls = t.dataset.simcls;
    S.sim.bar = S.sim.bar.map(() => null);   // a different class has different abilities
    return void render();
  }
  if (t.dataset.simrows){
    S.sim.rows = +t.dataset.simrows;
    return void render();
  }
  if (t.id === 'simClear'){ S.sim.bar = S.sim.bar.map(() => null); return void render(); }
  if (t.id === 'simRun')   return void simStart();
  if (t.id === 'simStop')  return void simStop();
  if (t.dataset.pal){
    if (SIM) return;                          // no editing the bar mid-run
    const i = S.sim.bar.indexOf(null);
    if (i >= 0){ S.sim.bar[i] = t.dataset.pal; render(); }
    return;
  }
  if (t.dataset.slot !== undefined){
    const i = +t.dataset.slot;
    if (SIM) return void simFire(i);          // during a run, a slot is a button
    S.sim.bar[i] = null;                      // otherwise clicking clears it
    return void render();
  }

  if (t.id === 'funnelToggle'){ funnelOpen = !funnelOpen; return void render(); }
  if (t.dataset.tab)      { S.tab = t.dataset.tab; return void render(); }
  if (t.dataset.pracmax)  { S.practice[t.dataset.pracmax] = 20; return void render(); }
  if (t.dataset.addnode)  return void openNodeEditor(t.dataset.addnode, null, t.dataset.lane);
  if (t.dataset.edittree) return void openTreeEditor(t.dataset.edittree);

  if (t.dataset.pick){
    const id = t.dataset.id;
    if (t.dataset.pick === 'race'){
      S.race = id;
      const archs = archetypesFor(id);
      if (!archs.includes(S.archetype)) S.archetype = archs[0];
      const cls = classesFor(id, S.archetype);
      if (!cls.includes(S.cls)) setClass(cls[0]);
    }
    if (t.dataset.pick === 'arch'){
      S.archetype = id;
      const cls = classesFor(S.race, id);
      if (!cls.includes(S.cls)) setClass(cls[0]);
    }
    if (t.dataset.pick === 'cls') setClass(id);
    return void render();
  }

  if (t.dataset.node){
    const tree = treeById(t.dataset.tree); if (!tree) return;
    if (S.editing) return void openNodeEditor(tree.id, t.dataset.node);
    const node = nodeInTree(tree, t.dataset.node); if (!node) return;
    const ids = ownedSet();

    /* Without hover, a first tap has to be allowed to mean "what is this?"
       — otherwise the descriptions are unreachable on a phone. Second tap on
       the same ability commits. */
    if (NO_HOVER && tapped !== node.id){
      tapped = node.id;
      document.querySelectorAll('.tnode.tapped').forEach(el => el.classList.remove('tapped'));
      t.classList.add('tapped');
      const r = t.getBoundingClientRect();
      showTip(tree, node, nodeState(tree, node, ids, budgetTotal() - spent()), r.left, r.bottom);
      return;
    }
    tapped = null;
    if (ids.has(node.id)){
      /* Sell it, and everything that hangs off it — otherwise the tree keeps
         abilities you could never have reached. */
      const drop = new Set([node.id, ...descendantsOf(tree, node.id)]);
      S.owned = S.owned.filter(x => !drop.has(x));
    } else {
      if (nodeState(tree, node, ids, budgetTotal() - spent()) !== 'available') return;
      S.owned = S.owned.concat(node.id);
    }
    return void render();
  }

  if (t.id === 'editToggle'){ S.editing = !S.editing; return void render(); }
  if (t.id === 'rulesBtn')   return void openRules();
  if (t.id === 'exportBtn')  return void openExport();
  if (t.id === 'importBtn')  return void openImport();
  if (t.id === 'resetBtn'){
    if (!confirm('Reset the ruleset and this build back to the shipped defaults? Everything you have edited is lost.')) return;
    if (SIM) simStop();
    RS = structuredClone(DEFAULT_RULESET);
    S = FRESH_STATE();
    return void render();
  }
});

/* Sliders get a targeted update rather than a full re-render: replacing the
   page mid-drag would destroy the element being dragged. */
function liveUpdate(){
  const lvn = document.querySelector('.lvnum');
  if (lvn) lvn.innerHTML = `${S.level}<small> / ${RS.budget.levelCap}</small>`;
  const beam = document.querySelector('.beam');
  if (beam) beam.outerHTML = viewBeam();

  const remaining = budgetTotal() - spent(), ids = ownedSet();
  for (const t of classTrees()){
    const sec = document.querySelector(`.tree[data-treeid="${t.id}"]`);
    if (!sec) continue;
    sec.querySelector('.treegrid-wrap').outerHTML = treeGridHtml(t, remaining, ids);
    sec.querySelector('.practice-val').textContent = practiceOf(t.id);
    sec.querySelector('.tree-spent').innerHTML = treeSpentHtml(t);
  }
  const sheet = document.querySelector('.col-sheet');
  if (sheet) sheet.outerHTML = viewSheet();
  save();
}

document.addEventListener('input', e => {
  if (e.target.id === 'lv'){ S.level = +e.target.value; return void liveUpdate(); }
  if (e.target.dataset.prac){ S.practice[e.target.dataset.prac] = +e.target.value; return void liveUpdate(); }
  if (e.target.id === 'charname'){ S.name = e.target.value; save(); }
});

/* Pointer-driven card. Skipped entirely on touch, where the card is pinned
   and controlled by tapping instead. */
document.addEventListener('mouseover', e => {
  if (NO_HOVER) return;
  const el = e.target.closest('.tnode'); if (!el) return;
  const tree = treeById(el.dataset.tree); if (!tree) return;
  const node = nodeInTree(tree, el.dataset.node); if (!node) return;
  showTip(tree, node, nodeState(tree, node, ownedSet(), budgetTotal() - spent()), e.clientX, e.clientY);
});
document.addEventListener('mousemove', e => {
  if (NO_HOVER || !tipEl.classList.contains('on')) return;
  if (!e.target.closest('.tnode')) return void hideTip();
  const r = tipEl.getBoundingClientRect();
  tipEl.style.left = Math.max(8, Math.min(e.clientX + 14, window.innerWidth - r.width - 10)) + 'px';
  tipEl.style.top = Math.max(8, Math.min(e.clientY + 14, window.innerHeight - r.height - 10)) + 'px';
});
document.addEventListener('mouseout', e => { if (!NO_HOVER && e.target.closest('.tnode')) hideTip(); });
/* A hidden tab gets its timers throttled, so rather than let the clock drift
   out of step with the cooldowns on screen, the run pauses and picks up where
   it left off. */
document.addEventListener('visibilitychange', () => {
  if (!SIM) return;
  if (document.hidden){
    if (simTimer){ clearInterval(simTimer); simTimer = null; }
    SIM.paused = true;
    simLog(SIM.t, 'Paused — tab hidden.', 'tick');
  } else if (SIM.paused){
    SIM.paused = false;
    SIM.wall = performance.now();
    simTimer = setInterval(simTick, 50);
    simLog(SIM.t, 'Resumed.', 'tick');
  }
});

/* ---------- dragging abilities onto the bar ---------- */
let dragId = null;
document.addEventListener('dragstart', e => {
  const p = e.target.closest('[data-pal]');
  if (!p || SIM) return;
  dragId = p.dataset.pal;
  e.dataTransfer.effectAllowed = 'copy';
  try { e.dataTransfer.setData('text/plain', dragId); } catch { /* Safari */ }
});
document.addEventListener('dragend', () => {
  dragId = null;
  document.querySelectorAll('.slot.dragover').forEach(el => el.classList.remove('dragover'));
});
document.addEventListener('dragover', e => {
  const s = e.target.closest('[data-slot]');
  if (!s || !dragId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  s.classList.add('dragover');
});
document.addEventListener('dragleave', e => {
  const s = e.target.closest('[data-slot]');
  if (s) s.classList.remove('dragover');
});
document.addEventListener('drop', e => {
  const s = e.target.closest('[data-slot]');
  if (!s || SIM) return;
  e.preventDefault();
  const id = dragId || (() => { try { return e.dataTransfer.getData('text/plain'); } catch { return null; } })();
  if (!id || !simNodeById(id)) return;
  S.sim.bar[+s.dataset.slot] = id;
  dragId = null;
  render();
});

/* Number keys fire bar slots during a run — the whole point is rhythm, and
   reaching for a mouse is not rhythm. */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeModal(); hideTip(); return; }
  if (!SIM || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) return;
  const n = e.key === '0' ? 10 : /^[1-9]$/.test(e.key) ? +e.key : null;
  if (n !== null){ e.preventDefault(); simFire(n - 1); }
});

render();
</script>
</body>
</html>
