<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Isles — Character Builder</title>
<style>
/* ============================================================
   THE ISLES — CHARACTER BUILDER
   A planning instrument, not a game.

   Three gates govern every purchase, and they are deliberately separate:
     PRACTICE  earned by using the line — gates which DEPTH you may reach
     PATH      you must own a node's parent before you may buy it
     BUDGET    granted by level — gates how much you may own AT ONCE

   Each line is a spine you can walk to the end on its own, with side
   branches hanging off it that lead to alternate endings. So the question
   a line asks is "how deep do I go here", not "which lane do I pick".

   Palette is lifted from the archetype diagram: Innate green, Fighter blue,
   Vagabond purple, over ink and brass.
   ============================================================ */

:root{
  --ink:      #0f1117;
  --ink-2:    #161a23;
  --ink-3:    #1d2230;
  --ink-4:    #252b3b;
  --line:     #2b3242;
  --line-hi:  #3d4658;

  --parch:    #e6e2d6;
  --parch-2:  #a8aebc;
  --parch-3:  #6d7484;

  --brass:    #d4a72c;
  --brass-2:  #8a6d1a;

  --innate:   #3f9c46;
  --fighter:  #4a6fc4;
  --vagabond: #a049b8;
  --rust:     #c04a30;

  --display: 'Avenir Next Condensed','Oswald','Arial Narrow',Impact,sans-serif;
  --body: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --mono: ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;

  --r: 2px;
  --rowh: 58px;   /* one tier of a tree, gutter and grid share it */
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--parch);
  font-family:var(--body);
  font-size:13px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;color:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}

/* ---------- masthead + direction tabs ---------- */
.masthead{
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#12151d,#0f1117);
  padding:0 18px;
  display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;
  position:sticky;top:0;z-index:40;
}
.wordmark{
  font-family:var(--display);font-weight:700;font-size:19px;
  letter-spacing:.14em;text-transform:uppercase;
  padding:14px 0 12px;white-space:nowrap;
}
.wordmark .the{color:var(--parch-3);}
.wordmark .cb{color:var(--brass);}
/* Wraps: there are nine directions now, and at anything under a wide desktop a
   single row clips the last few off the right edge entirely. */
.tabs{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:flex-end;margin-left:auto;}
.tab{
  background:none;border:0;border-bottom:2px solid transparent;
  padding:14px 16px 11px;
  font-family:var(--display);font-size:12.5px;letter-spacing:.13em;
  text-transform:uppercase;font-weight:600;color:var(--parch-3);
  transition:color .12s,border-color .12s;
}
.tab:hover{color:var(--parch-2);}
.tab[aria-selected="true"]{color:var(--brass);border-bottom-color:var(--brass);}
.tab .dot{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--parch-3);margin-right:7px;vertical-align:2px;
}
.tab[aria-selected="true"] .dot{background:var(--brass);}
.tab.stub .dot{background:none;border:1px solid var(--parch-3);}

/* ---------- the budget beam: the signature element ---------- */
.beam{
  border-bottom:1px solid var(--line);background:var(--ink-2);
  padding:9px 18px 11px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  position:sticky;top:47px;z-index:39;
}
.beam-label{
  font-family:var(--display);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--parch-3);white-space:nowrap;
}
.beam-track{
  flex:1;min-width:200px;height:14px;background:#0a0c11;
  border:1px solid var(--line);position:relative;overflow:hidden;
}
.beam-fill{
  position:absolute;inset:0 auto 0 0;
  background:linear-gradient(180deg,#e8bd41,#b3891f);
  transition:width .22s cubic-bezier(.2,.8,.3,1);
}
.beam-fill.over{background:linear-gradient(180deg,#d8563a,#8f3220);}
.beam-ticks{position:absolute;inset:0;pointer-events:none;}
.beam-ticks i{position:absolute;top:0;bottom:0;width:1px;background:#0a0c1188;}
.beam-num{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.beam-num b{color:var(--brass);font-weight:600;}
.beam-num.over b{color:var(--rust);}
.beam-num span{color:var(--parch-3);}
.beam-note{font-family:var(--mono);font-size:11px;color:var(--parch-3);white-space:nowrap;}
.beam-note b{color:var(--parch-2);font-weight:500;}

/* ---------- three-column frame ---------- */
.frame{
  display:grid;
  grid-template-columns:238px minmax(0,1fr) 300px;
  align-items:start;
  min-height:calc(100vh - 120px);
}
.col{padding:16px;min-width:0;}
.col-funnel{border-right:1px solid var(--line);}
.col-sheet{border-left:1px solid var(--line);background:#0d0f15;}

.legend{
  font-family:var(--display);font-size:10.5px;letter-spacing:.19em;
  text-transform:uppercase;color:var(--parch-3);
  margin:18px 0 9px;display:flex;align-items:center;gap:9px;
}
.legend:first-child{margin-top:0;}
.legend::after{content:"";flex:1;height:1px;background:var(--line);}

/* ---------- funnel ---------- */
.step{margin-bottom:16px;}
.step-head{display:flex;align-items:baseline;gap:7px;margin-bottom:6px;}
.step-rank{
  font-family:var(--mono);font-size:10px;color:var(--parch-3);
  border:1px solid var(--line);padding:0 4px;border-radius:var(--r);
}
.step-name{
  font-family:var(--display);font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--parch-2);
}
.step-lv{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--parch-3);}

.pickers{display:flex;flex-direction:column;gap:3px;}
.pick{
  display:flex;align-items:center;gap:8px;
  background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 9px;text-align:left;width:100%;
  transition:border-color .12s,background .12s;
}
.pick:hover:not(:disabled){border-color:var(--line-hi);background:var(--ink-3);}
.pick[aria-pressed="true"]{
  border-color:var(--pc,var(--brass));
  background:color-mix(in srgb,var(--pc,var(--brass)) 12%,var(--ink-2));
}
.pick:disabled{opacity:.3;cursor:not-allowed;}
.pick-swatch{width:3px;align-self:stretch;background:var(--pc,var(--line-hi));border-radius:1px;flex:none;}
.pick-name{font-weight:600;font-size:12.5px;}
.pick-blurb{font-size:10.5px;color:var(--parch-3);line-height:1.35;margin:2px 0 0;}
.pick-body{min-width:0;flex:1;}
.gate-note{
  font-size:10.5px;color:var(--parch-3);font-style:italic;
  margin:6px 0 0;padding-left:10px;border-left:1px solid var(--line);
}

.lvwrap{display:flex;align-items:center;gap:12px;margin-top:4px;}
.lvnum{
  font-family:var(--display);font-size:30px;font-weight:700;color:var(--brass);
  line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;
}
.lvnum small{font-size:12px;color:var(--parch-3);font-weight:400;letter-spacing:.04em;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:none;}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:2px;}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-5px;
  border-radius:2px;background:var(--brass);border:1px solid #0a0c11;cursor:grab;
}
input[type=range]::-moz-range-track{height:3px;background:var(--line);border-radius:2px;}
input[type=range]::-moz-range-thumb{
  width:12px;height:12px;border-radius:2px;background:var(--brass);
  border:1px solid #0a0c11;cursor:grab;
}

/* ---------- the three lines ---------- */
.trees{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.tree{
  border:1px solid var(--line);border-radius:var(--r);background:var(--ink-2);
  display:flex;flex-direction:column;min-width:0;
}
.tree-head{
  padding:9px 10px 8px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--ink-3),var(--ink-2));
}
.tree-name{
  font-family:var(--display);font-size:14px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:700;color:var(--tc,var(--parch));
  display:flex;align-items:center;gap:7px;
}
.tree-spent{
  margin-left:auto;font-family:var(--mono);font-size:10.5px;
  color:var(--parch-3);font-weight:400;letter-spacing:0;
}
.tree-spent b{color:var(--brass);font-weight:600;}
.tree-blurb{font-size:10.5px;color:var(--parch-3);margin:3px 0 0;line-height:1.35;}

.practice{
  padding:7px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;background:#0d0f15;
}
.practice-lab{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--parch-3);white-space:nowrap;
}
.practice-val{
  font-family:var(--mono);font-size:12px;color:var(--parch);
  font-variant-numeric:tabular-nums;min-width:16px;text-align:right;
}
.practice input[type=range]{flex:1;min-width:0;}
.practice-max{
  background:none;border:1px solid var(--line);border-radius:var(--r);
  font-family:var(--mono);font-size:9.5px;color:var(--parch-3);padding:1px 5px;flex:none;
}
.practice-max:hover{border-color:var(--brass-2);color:var(--brass);}

/* --- the tree grid: a spine down the middle, branches to either side --- */
.treegrid-wrap{display:flex;gap:3px;padding:8px 6px 10px;}
.rowlabels{display:grid;grid-auto-rows:var(--rowh);width:16px;flex:none;}
.rowlab{
  font-family:var(--mono);font-size:9px;color:var(--parch-3);
  display:flex;align-items:center;justify-content:center;
}
.treegrid{
  position:relative;flex:1;min-width:0;
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:var(--rowh);
}
/* Edges are drawn in a stretched SVG whose viewBox matches the grid exactly:
   three equal columns (x = 50/150/250 of 300) and equal rows (y = row*100+50).
   preserveAspectRatio="none" makes the cell centres line up at any width. */
.tedges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.tedges line{stroke:#4d566b;stroke-width:2;vector-effect:non-scaling-stroke;}
.tedges line.lit{stroke:var(--tc,var(--brass));stroke-width:2.5;opacity:.9;}
.tedges line.dim{opacity:.4;}

.tnode{
  position:relative;z-index:1;align-self:center;margin:0 3px;
  min-width:0;height:calc(var(--rowh) - 12px);
  display:flex;flex-direction:column;justify-content:center;gap:1px;
  background:var(--ink-3);border:1px solid var(--line);border-radius:var(--r);
  padding:3px 5px;text-align:left;overflow:hidden;
  transition:background .12s,border-color .12s,opacity .12s;
}
.tnode:hover{border-color:var(--line-hi);}
.tnode-name{
  font-size:10.5px;font-weight:600;line-height:1.15;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tnode-meta{
  display:flex;align-items:center;gap:4px;
  font-family:var(--mono);font-size:8.5px;color:var(--parch-3);
}
.tnode-cost{color:var(--parch-2);font-weight:600;}
.tnode-draft{
  border:1px dashed var(--line-hi);border-radius:2px;padding:0 2px;
  font-size:7.5px;letter-spacing:.06em;text-transform:uppercase;
}
.tnode-dot{width:4px;height:4px;border-radius:50%;background:var(--tc,var(--brass));opacity:.8;flex:none;}

/* node states */
.tnode.owned{
  background:color-mix(in srgb,var(--tc,var(--brass)) 20%,var(--ink-3));
  border-color:color-mix(in srgb,var(--tc,var(--brass)) 60%,transparent);
}
.tnode.owned .tnode-cost{color:var(--brass);}
.tnode.available{border-color:var(--line-hi);}
.tnode.available .tnode-name{color:var(--parch);}
.tnode.unaffordable{opacity:.45;}
.tnode.unaffordable .tnode-cost{color:var(--rust);}
.tnode.needs-parent{opacity:.34;border-style:dashed;}
.tnode.locked{opacity:.2;cursor:not-allowed;}

/* the practice waterline, drawn across the whole grid */
.waterline{
  position:absolute;left:0;right:0;height:0;z-index:2;
  border-top:1px dashed var(--brass-2);pointer-events:none;
  display:flex;justify-content:flex-end;
}
.waterline span{
  font-family:var(--mono);font-size:8px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--brass-2);background:var(--ink-2);padding:0 3px;transform:translateY(-50%);
}

/* hover card — the descriptions live here now that nodes are compact */
#tip{
  position:fixed;z-index:70;max-width:280px;pointer-events:none;
  background:#0a0c11;border:1px solid var(--line-hi);border-radius:var(--r);
  padding:8px 10px;box-shadow:0 10px 30px #000a;display:none;
}
#tip.on{display:block;}
#tip .t-name{font-weight:700;font-size:12.5px;margin-bottom:2px;}
#tip .t-meta{
  font-family:var(--mono);font-size:9.5px;color:var(--parch-3);
  margin-bottom:5px;letter-spacing:.04em;
}
#tip .t-text{font-size:11.5px;line-height:1.45;color:var(--parch-2);}
#tip .t-why{
  margin-top:6px;padding-top:5px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--rust);
}
#tip .tags{margin-top:6px;}
/* An effect the ability puts on the board, spelled out. Red bar for hostile,
   green for one you get to keep. */
#tip .t-eff{
  margin-top:6px;padding:5px 7px;border-left:2px solid var(--rust);
  background:#12151d;border-radius:0 var(--r) var(--r) 0;
}
#tip .t-eff.friendly{border-left-color:var(--innate);}
#tip .t-eff-h{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--parch);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;
}
#tip .t-eff-m{letter-spacing:.04em;text-transform:none;color:var(--parch-3);font-size:9px;}
#tip .t-eff-t{font-size:11px;line-height:1.4;color:var(--parch-2);margin-top:2px;}

.tags{display:flex;flex-wrap:wrap;gap:3px;}
.tag{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:var(--parch-3);
  background:#0c0e14;border:1px solid var(--line);padding:0 4px;border-radius:2px;
}

/* ---------- build sheet ---------- */
.sheet-name{
  font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;line-height:1.05;margin:0 0 2px;
}
.sheet-name input{
  background:none;border:0;border-bottom:1px dashed var(--line);
  font:inherit;letter-spacing:inherit;text-transform:inherit;width:100%;padding:0 0 2px;
}
.sheet-name input:focus{outline:none;border-bottom-color:var(--brass);}
.sheet-sub{
  font-family:var(--mono);font-size:10.5px;color:var(--parch-3);
  letter-spacing:.05em;margin:0 0 14px;
}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
}
.stat{background:var(--ink-2);padding:7px 8px;}
.stat-k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--parch-3);}
.stat-v{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;}

.shape{display:flex;flex-direction:column;gap:5px;}
.shape-row{display:flex;align-items:center;gap:8px;}
.shape-k{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--parch-3);width:62px;flex:none;
}
.shape-bar{flex:1;height:7px;background:#0a0c11;border:1px solid var(--line);border-radius:1px;overflow:hidden;}
.shape-fill{height:100%;background:var(--tc,var(--brass));transition:width .22s;}
.shape-v{
  font-family:var(--mono);font-size:9.5px;color:var(--parch-3);width:20px;
  text-align:right;flex:none;font-variant-numeric:tabular-nums;
}

.owned-list{display:flex;flex-direction:column;gap:1px;}
.owned-row{
  display:flex;align-items:baseline;gap:7px;padding:3px 0;
  border-bottom:1px solid var(--ink-3);font-size:11.5px;
}
.owned-row .ln{width:3px;align-self:stretch;background:var(--tc);flex:none;border-radius:1px;}
.owned-row .nm{font-weight:600;}
.owned-row .tr{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--parch-3);white-space:nowrap;}
.empty{
  font-size:11px;color:var(--parch-3);font-style:italic;
  border:1px dashed var(--line);border-radius:var(--r);padding:12px;text-align:center;
}
.diag{
  border:1px solid var(--line);border-radius:var(--r);
  background:var(--ink-2);padding:9px 10px;font-size:11px;line-height:1.5;
}
.diag b{color:var(--brass);font-family:var(--mono);font-weight:600;}
.diag .warn{color:var(--rust);}

/* ---------- footer ---------- */
.footbar{
  position:sticky;bottom:0;z-index:38;
  border-top:1px solid var(--line);background:var(--ink-2);
  padding:8px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.btn{
  background:var(--ink-3);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 12px;font-family:var(--display);font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;font-weight:600;color:var(--parch-2);
  transition:border-color .12s,color .12s,background .12s;
}
.btn:hover{border-color:var(--line-hi);color:var(--parch);background:var(--ink-4);}
.btn.primary{border-color:var(--brass-2);color:var(--brass);}
.btn.primary:hover{background:color-mix(in srgb,var(--brass) 14%,var(--ink-3));border-color:var(--brass);}
.btn[aria-pressed="true"]{
  background:color-mix(in srgb,var(--brass) 18%,var(--ink-3));
  border-color:var(--brass);color:var(--brass);
}
.btn.danger:hover{border-color:var(--rust);color:var(--rust);}
.foot-note{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--parch-3);}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;background:#05060acc;z-index:60;
  display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px);
}
.modal{
  background:var(--ink-2);border:1px solid var(--line-hi);border-radius:var(--r);
  width:100%;max-width:680px;max-height:86vh;display:flex;flex-direction:column;
  box-shadow:0 24px 60px #000a;
}
.modal-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
.modal-title{font-family:var(--display);font-size:14px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;}
.modal-body{padding:14px;overflow:auto;}
.modal-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;}
.x{background:none;border:0;color:var(--parch-3);font-size:18px;margin-left:auto;line-height:1;padding:0 4px;}
.x:hover{color:var(--parch);}

.field{margin-bottom:10px;}
.field label{
  display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--parch-3);margin-bottom:3px;
}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;background:#0c0e14;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brass-2);}
.field textarea{resize:vertical;min-height:56px;line-height:1.45;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.checks{display:flex;flex-wrap:wrap;gap:8px;}
.checks label{
  display:flex;align-items:center;gap:5px;font-family:var(--body);font-size:11.5px;
  letter-spacing:0;text-transform:none;color:var(--parch-2);
  background:var(--ink-3);border:1px solid var(--line);border-radius:var(--r);
  padding:4px 8px;cursor:pointer;margin:0;
}
.checks input{accent-color:var(--brass);margin:0;}
.hint{font-size:11px;color:var(--parch-3);line-height:1.5;margin:0 0 10px;}

pre.dump{
  background:#0a0c11;border:1px solid var(--line);border-radius:var(--r);padding:10px;
  font-family:var(--mono);font-size:10.5px;line-height:1.5;max-height:320px;overflow:auto;

/* ============================================================
   LOADOUT SIMULATOR
   The combat model being demonstrated: a round is one second, and every
   ability costs TWO different things — a cooldown before you may use THAT
   ability again, and an action time during which you may use NOTHING. The
   second one is the point; it is what stops a bar from being spammed.
   ============================================================ */
.simwrap{max-width:1180px;margin:0 auto;padding:18px 18px 40px;}

.slot-lock{           /* global action timer — every slot dims a little */

.dir-axes td{padding:5px 8px;border-bottom:1px solid var(--ink-3);color:var(--parch-2);vertical-align:top;}
.dir-axes td:first-child{font-weight:600;color:var(--parch);white-space:nowrap;}

/* ---------- narrow screens ----------
   Two things dominate a phone: sticky chrome eating the viewport, and the
   funnel's blurbs pushing the trees a full screen down. Both go. */
@media (max-width:820px){
  .masthead{position:static;padding:0 12px;gap:0;}

  .tabs{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;

  .btn{padding:7px 10px;}

.funnel-sum{display:flex;align-items:center;gap:12px;}

  #tip{left:8px !important;right:8px !important;top:auto !important;bottom:8px !important;max-width:none;}
}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

<body>

<header class="masthead">
  <div class="wordmark"><span class="the">The Isles</span> <span class="cb">Character Builder</span></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>

<div id="app"></div>
<div id="tip"></div>
<div id="modalHost"></div>

<script>
/* ============================================================
   PART 1 — THE RULESET
   Every number and every word below is data, and all of it is editable in
   the app. `draft:true` marks content invented to fill the shape; the rest
   is drawn from MAGIC-DESIGN.md, MAGIC-OPTIONS.md or src/sim.
   ============================================================ */

/* Six tiers deep. Practice required, and budget cost, per tier. Deeper is
   both harder to reach and more expensive to hold, which is what makes
   "how far do I go into this line" the actual decision.

   Every practice value here is a real rung of the game's own ladder
   (1/3/5/7/10/13/16/20, src/sim/styles.ts) — six of its eight — so a tier in
   this tool always means something the game already recognises. */
const ROWS     = [1, 3, 5, 10, 16, 20];
const ROWCOST  = [2, 3, 4,  6,  8, 11];

/* Spine alone: 34. Both branches too: 78. All three lines, spine only: 102 —
   which is almost exactly the level-50 budget of 103. So at cap you can take
   every line to its end, OR take one line everywhere and give up a lot. */

function n(name, tags, text, grounded){
  return { name, tags, text, grounded: !!grounded };
}

/**
 * A line: a spine of six you can walk to the end unaided, plus two side
 * branches that hang off it and lead somewhere else.
 *
 *            s1
 *            s2
 *            s3 ──┐
 *      a1 ◀──┘    s4 ──┐
 *      a2         s5   b1
 *      a3         s6   b2
 *
 * Branch A leaves the spine at s3 and runs down the left; branch B leaves at
 * s4 and runs down the right. Ignoring both still gets you s6.
 */
function tree(id, name, ownerClass, blurb, spine, branchA, branchB){
  const nodes = [];
  const mk = (src, key, row, col, parent) => {
    nodes.push({
      id: `${id}_${key}`,
      name: src.name,
      row, col,
      reqSkill: ROWS[row] ?? ROWS[ROWS.length - 1],
      cost: ROWCOST[row] ?? ROWCOST[ROWCOST.length - 1],
      requires: parent ? [`${id}_${parent}`] : [],
      tags: src.tags.split(/\s+/).filter(Boolean),
      text: src.text,
      draft: !src.grounded,
    });
  };

  spine.forEach((s, i) => mk(s, 's' + (i + 1), i, 1, i > 0 ? 's' + i : null));
  branchA.forEach((s, i) => mk(s, 'a' + (i + 1), 3 + i, 0, i > 0 ? 'a' + i : 's3'));
  branchB.forEach((s, i) => mk(s, 'b' + (i + 1), 4 + i, 2, i > 0 ? 'b' + i : 's4'));

  return { id, name, blurb, ownerClasses: [ownerClass], nodes };
}

const DEFAULT_RULESET = {
  meta: { name: 'Trees & Budget', version: 2, notes: '' },

  budget: { base: 5, perLevel: 2, levelCap: 50 },

  /* ---- effects glossary ----------------------------------------------------
     "Adds 2 burning" says nothing unless you know what burning does, so every
     effect an ability mentions is spelled out on its hover card.

     `grounded` here means the effect is REAL — it exists in src/sim/effects.ts
     and the game already runs it. The rest are proposed by MAGIC-DESIGN.md and
     do not exist yet; the card says so. `match` is the words in an ability's
     text that pull the effect onto its card. */
  effects: {
    // --- live in the game today (src/sim/effects.ts) ---
    bleed:      { label: 'Bleeding',   hostile: 1, maxStacks: 3, grounded: 1, match: ['bleed','bleeding'],
                  text: 'Losing blood each round — 3 damage per stack. Stacks up to three.' },
    sunder:     { label: 'Sundered',   hostile: 1, maxStacks: 3, grounded: 1, match: ['sunder','sundered'],
                  text: 'Armour broken — 2 less per stack, for everyone hitting it.' },
    exposed:    { label: 'Exposed',    hostile: 1, maxStacks: 1, grounded: 1, match: ['exposed'],
                  text: 'The next hit from any source lands for half again.' },
    concussed:  { label: 'Concussed',  hostile: 1, maxStacks: 1, grounded: 1, match: ['concussed'],
                  text: 'Head still ringing. The mace line builds on this.' },
    dazed:      { label: 'Dazed',      hostile: 1, maxStacks: 1, grounded: 1, match: ['daze','dazed','go wide','blind'],
                  text: 'Its next swing is likely to go wide.' },
    stunned:    { label: 'Stunned',    hostile: 1, maxStacks: 1, grounded: 1, match: ['stun','stunned','stagger','staggers','knocked down','does not get a turn','loses its next action','lose their next action','loses a round'],
                  text: 'Loses its turn entirely.' },
    rooted:     { label: 'Rooted',     hostile: 1, maxStacks: 1, grounded: 1, match: ['root','roots','rooted'],
                  text: 'Cannot move. Can still swing at what is next to it.' },
    slowed:     { label: 'Slowed',     hostile: 1, maxStacks: 1, grounded: 1, match: ['slow','slowed','slows'],
                  text: 'Acts at half pace.' },
    braced:     { label: 'Braced',     hostile: 0, maxStacks: 1, grounded: 1, match: ['braced'],
                  text: 'Blocking far more — but planted where you stand.' },
    shieldwall: { label: 'Shield Wall',hostile: 0, maxStacks: 1, grounded: 1, match: ['shield wall'],
                  text: 'Your shield’s armour counts twice.' },
    overlap:    { label: 'Overlap',    hostile: 0, maxStacks: 1, grounded: 1, match: ['overlap'],
                  text: 'The next blow against you is blocked, guaranteed.' },
    immovable:  { label: 'Immovable',  hostile: 0, maxStacks: 1, grounded: 1, match: ['immovable'],
                  text: 'Cannot be moved, stunned or staggered. Blocks bite back.' },
    setspear:   { label: 'Set',        hostile: 0, maxStacks: 1, grounded: 1, match: ['set against'],
                  text: 'Braced for a charge — the first thing to close takes a free hit.' },
    reaping:    { label: 'Reaping',    hostile: 0, maxStacks: 5, grounded: 1, match: ['reaping','momentum of the last sweep'],
                  text: 'Your last sweep caught this many. The halberd’s finishers hit +35% per stack and spend the lot.' },

    // --- proposed in MAGIC-DESIGN.md, not built ---
    burning:    { label: 'Burning',    hostile: 1, maxStacks: 3, match: ['burning'],
                  text: 'Fire damage each round, stacking to three. Fire’s spenders cash the whole stack in at once.' },
    chilled:    { label: 'Chilled',    hostile: 1, maxStacks: 3, match: ['chilled','chills'],
                  text: 'Acts more slowly, stacking to three. Ice’s spenders cash the whole stack in at once.' },
    withering:  { label: 'Withering',  hostile: 1, maxStacks: 3, match: ['withering'],
                  text: 'Damage each round AND the target cannot heal or regenerate while it holds. That second half is what makes it worth casting in a fight too short for a DOT.' },
    enfeebled:  { label: 'Enfeebled',  hostile: 1, maxStacks: 1, match: ['enfeeble','enfeebled'],
                  text: 'Deals a quarter less damage.' },
    poisoned:   { label: 'Poisoned',   hostile: 1, maxStacks: 3, match: ['poison','poisoned','venom'],
                  text: 'Damage each round, and it ticks harder for every round it has already held.' },
  },

  /* ---- the combat model the Loadout Sim demonstrates ----------------------
     NOT what the game does today. The game runs a 1-second round and one
     attack per round, full stop. This is the proposed direction: every
     ability costs two separate things.

       cooldown   — rounds before you may use THAT ability again
       actionTime — rounds before you may use ANY ability at all

     The second is the one that changes the feel. A 3-round action time means
     a big spell is three rounds of committing, which is what turns a bar from
     something you spam into something you decide with.

     Numbers are derived per tier rather than hand-set on 198 abilities, so
     the curve can be retuned in one place. A node may carry its own `sim`
     object to override any of it. */

    targetHp: 6000,

        n('Black Harvest','dot area','Every death from your disease spreads it again from where the body fell.') ],
      [ n('Consumption','dot debuff','Withering you applied can no longer be cleansed or dispelled.'),
        n('Slow Death','dot','Withering outpaces any healing the target can receive. It only goes down.') ]),

    tree('debuffs','Debuffs','warlock','Winning by subtraction. Nothing here deals damage on its own.',
      [ n('Curse of Weight','debuff control','Movement costs the target double.'),
        n('Hex','debuff','The target’s resistances drop across the board.'),
        n('Silence','debuff control','The target cannot cast for 3 rounds.'),
        n('Shatter Ward','debuff control','Strips one buff and prevents it being recast for 3 rounds.'),
        n('Mark of Ruin','debuff support','Everything that hits the target — anyone’s — hits harder.'),
        n('Nightfall','debuff area','Every enemy within 3 tiles takes every debuff you know, at half duration.') ],
      [ n('Doom','debuff sustain','The target takes more damage for every round the fight has run.'),
        n('Despair','debuff','Healing the target receives is halved.'),
        n('Oblivion','debuff','The target has no resistances and receives no healing at all. Four rounds.') ],
      [ n('Null Field','terrain debuff','A zone of 3 tiles where nothing may be cast, by anyone, including you.'),
        n('Unmaking','debuff control','Strip everything the target has and prevent all of it for 5 rounds.') ]),
  ],
};
</script>
<script>
/* ============================================================
   PART 2 — THE APPLICATION
   ============================================================ */
const LS_RULES = 'isles.charbuilder.ruleset.v2';
const LS_STATE = 'isles.charbuilder.state.v2';

/* A ruleset saved by an older build is missing whatever has been added since —
   `effects` was added after the first release, and a stored copy without it
   would silently drop the glossary. Fill in any top-level key the saved copy
   has never heard of, while leaving everything it DOES have alone, because
   those are the edits we are trying to preserve. */
function migrate(saved){
  if (!saved) return structuredClone(DEFAULT_RULESET);
  for (const [k, v] of Object.entries(DEFAULT_RULESET))
    if (saved[k] === undefined) saved[k] = structuredClone(v);
  return saved;
}
let RS = migrate(load(LS_RULES));
const FRESH_STATE = () => ({
  tab: 'trees', name: 'Unnamed', race: 'human', archetype: 'innate', cls: 'mage',
  level: 10, practice: {}, owned: [], editing: false, notes: '',
  sim: { cls: 'mage', bar: new Array(12).fill(null), rows: 1 },
});
let S = Object.assign(FRESH_STATE(), load(LS_STATE) || {});
if (!S.sim || !Array.isArray(S.sim.bar)) S.sim = FRESH_STATE().sim;

function load(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } }
function save(){
  try {
    localStorage.setItem(LS_RULES, JSON.stringify(RS));
    localStorage.setItem(LS_STATE, JSON.stringify(S));
  } catch { /* private browsing — it still works, it just won't remember */ }
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- derived ---------- */
const treeById = id => RS.trees.find(t => t.id === id);
const ownedSet = () => new Set(S.owned);
const nodeInTree = (t, id) => t.nodes.find(x => x.id === id);

function classTrees(){
  const c = RS.classes[S.cls];
  return c ? c.trees.map(treeById).filter(Boolean) : [];
}
function archColor(clsId){
  const c = RS.classes[clsId];
  const a = c && RS.archetypes[c.archetype];
  return (a && a.color) || 'var(--brass)';
}
function budgetTotal(lv){ return Math.round(RS.budget.base + RS.budget.perLevel * ((lv ?? S.level) - 1)); }
function practiceOf(id){ return S.practice[id] ?? 1; }
function rowsOf(t){ return Math.max(...t.nodes.map(n => n.row)) + 1; }
function treeCost(t){ return t.nodes.reduce((a, n) => a + (+n.cost || 0), 0); }

function ownedNodes(){
  const ids = ownedSet(), out = [];
  for (const t of classTrees()) for (const n of t.nodes) if (ids.has(n.id)) out.push({ tree: t, node: n });
  return out;
}
function spent(){ return ownedNodes().reduce((a, x) => a + (+x.node.cost || 0), 0); }

function stats(){
  const c = RS.classes[S.cls], race = RS.races[S.race];
  if (!c || !race) return { hp: 0, mana: 0, stam: 0 };
  const lv = S.level - 1;
  return {
    hp:   Math.round((c.hp   + c.hpLv   * lv) * race.hpMult),
    mana: Math.round((c.mana + c.manaLv * lv) * race.manaMult),
    stam: Math.round((c.stam + c.stamLv * lv) * race.stamMult),
  };
}
function shape(){
  const axes = {}; RS.shapeAxes.forEach(a => axes[a] = 0);
  for (const { node } of ownedNodes())
    for (const tag of node.tags){
      const w = RS.tagWeights[tag]; if (!w) continue;
      for (const [axis, v] of Object.entries(w)) if (axis in axes) axes[axis] += v;
    }
  return { axes, max: Math.max(1, ...Object.values(axes)) };
}

/* Why a node is or is not buyable right now. Three gates, checked in the
   order the player experiences them. */
function nodeState(t, node, ids, remaining){
  if (ids.has(node.id)) return 'owned';
  if (node.reqSkill > practiceOf(t.id)) return 'locked';
  if (!node.requires.every(r => ids.has(r))) return 'needs-parent';
  if ((+node.cost || 0) > remaining) return 'unaffordable';
  return 'available';
}
function whyBlocked(t, node, state){
  if (state === 'locked') return `Needs practice ${node.reqSkill}. You have ${practiceOf(t.id)}.`;
  if (state === 'needs-parent'){
    const names = node.requires.map(r => (nodeInTree(t, r) || {}).name).filter(Boolean);
    return `Take ${names.join(' and ')} first.`;
  }
  if (state === 'unaffordable') return `Costs ${node.cost}. You have ${budgetTotal() - spent()} left.`;
  return '';
}
/* Which effects an ability puts on the board. Derived by scanning its own
   text for the effect's `match` words rather than hand-tagged on 198 nodes —
   and an explicit `node.effects` array overrides the scan when the wording
   does not give it away. */
function effectsFor(node){
  if (Array.isArray(node.effects)) return node.effects.filter(id => RS.effects[id]);
  /* Name and tags count as well as the prose: "Enfeeble" and a `bleed` tag both
     mean the effect without the description ever spelling it out. */
  const hay = ' ' + [node.name, node.text, (node.tags || []).join(' ')].join(' ').toLowerCase() + ' ';
  const hit = [];
  for (const [id, def] of Object.entries(RS.effects || {})){
    const words = def.match || [id];
    if (words.some(w => new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(hay)))
      hit.push(id);
  }
  return hit;
}

/* Selling a node has to take everything hanging off it too, or the tree
   would be left with orphans that were never legally reachable. */
function descendantsOf(t, id){
  const out = [], stack = [id];
  while (stack.length){
    const cur = stack.pop();
    for (const nd of t.nodes)
      if (nd.requires.includes(cur) && !out.includes(nd.id)){ out.push(nd.id); stack.push(nd.id); }
  }
  return out;
}

/* ---------- gating ---------- */
function classesFor(raceId, archId){
  const race = RS.races[raceId]; if (!race) return [];
  return RS.classOrder.filter(id => {
    const c = RS.classes[id];
    return c && race.allows.includes(id) && (!archId || c.archetype === archId);
  });
}
const archetypesFor = raceId => RS.archetypeOrder.filter(a => classesFor(raceId, a).length > 0);

function reconcile(){
  if (!RS.races[S.race]) S.race = RS.raceOrder[0];
  const archs = archetypesFor(S.race);
  if (!archs.includes(S.archetype)) S.archetype = archs[0] || null;
  const cls = classesFor(S.race, S.archetype);
  if (!cls.includes(S.cls)) setClass(cls[0] || null, true);
  S.level = Math.max(1, Math.min(RS.budget.levelCap, S.level));
}
function setClass(id, quiet){
  if (S.cls === id && quiet) return;
  S.cls = id; S.owned = []; S.practice = {};
}

/* ============================================================
   RENDER
   ============================================================ */
const app = document.getElementById('app');
const tabsEl = document.getElementById('tabs');
/**
 * Nine directions, numbered so they can be argued about by name.
 *
 * One to three are the original set. Four to nine were added to widen the field
 * before anything gets committed, and they are deliberately spread across the
 * two axes that actually differ — WHERE the build lives (on the character, on
 * the gear, on the bar, out in the world) and WHAT pays for it (points, use,
 * deeds, nothing at all). Two directions that share both answers are the same
 * direction with different words, and are not worth a tab.
 */
const TABS = [
  { id: 'trees',      label: 'Trees & Budget', stub: false },
  { id: 'sim',        label: 'Loadout Sim',    stub: false },
  { id: 'directions', label: 'Directions',     stub: true  },
];

function renderTabs(){
  tabsEl.innerHTML = TABS.map(t =>
    `<button class="tab${t.stub ? ' stub' : ''}" role="tab" data-tab="${t.id}"
       aria-selected="${S.tab === t.id}"><span class="dot"></span>${esc(t.label)}</button>`).join('');
}
function render(){
  reconcile(); renderTabs();
  document.body.classList.toggle('editing', !!S.editing);
  hideTip();
  /* Old saved state may still name a tab that no longer exists — the eight
     direction tabs became one. */
  if (!TABS.some(t => t.id === S.tab)) S.tab = 'trees';
  app.innerHTML = S.tab === 'trees' ? viewTrees()
                : S.tab === 'sim'   ? viewSim()
                : viewDirections();
  if (SIM) paintSim();   // a re-render mid-run rebuilds the slots; refill them
  save();
}

function viewBeam(){
  const total = budgetTotal(), sp = spent(), over = sp > total;
  const pct = total > 0 ? Math.min(100, (sp / total) * 100) : 0;
  const capTotal = budgetTotal(RS.budget.levelCap);
  const classCost = classTrees().reduce((a, t) => a + treeCost(t), 0);
  const ownPct = classCost > 0 ? Math.round((capTotal / classCost) * 100) : 0;
  const ticks = [];
  for (let i = 10; i < total; i += 10) ticks.push(`<i style="left:${(i / total) * 100}%"></i>`);
  return `
  <div class="beam">
    <span class="beam-label">Budget</span>
    <div class="beam-track" role="img" aria-label="${sp} of ${total} points spent">
      <div class="beam-fill${over ? ' over' : ''}" style="width:${pct}%"></div>
      <div class="beam-ticks">${ticks.join('')}</div>
    </div>
    <span class="beam-num${over ? ' over' : ''}"><b>${sp}</b> <span>/ ${total} spent</span></span>
    <span class="beam-note">at level <b>${RS.budget.levelCap}</b> you can own <b>${ownPct}%</b> of this class</span>
  </div>`;
}

/* On a phone the funnel is fifteen rows plus a slider, which pushes the trees
   clean off the bottom of the screen. Collapsed to a summary you tap to open. */
let funnelOpen = false;

function viewFunnelSummary(){
  const race = RS.races[S.race], c = RS.classes[S.cls];
  return `
  <div class="col col-funnel">
    <div class="funnel-sum">
      <div>
        <div class="funnel-sum-who">${esc(race.name)} ${esc(c ? c.name : '—')}</div>
        <div class="funnel-sum-sub">${esc(c ? RS.archetypes[c.archetype].name : '')} · level ${S.level}</div>
      </div>
      <button class="btn" id="funnelToggle">Change</button>
    </div>
  </div>`;
}

function viewFunnel(){
  if (NO_HOVER && !funnelOpen) return viewFunnelSummary();
  const race = RS.races[S.race];
  const archs = archetypesFor(S.race), cls = classesFor(S.race, S.archetype);

  const raceBtns = RS.raceOrder.map(id => {
    const rr = RS.races[id];
    return `<button class="pick" data-pick="race" data-id="${id}" aria-pressed="${S.race === id}">
      <span class="pick-swatch"></span><span class="pick-body">
        <span class="pick-name">${esc(rr.name)}</span>
        <span class="pick-blurb">${esc(rr.blurb)}</span></span></button>`;
  }).join('');

  const archBtns = RS.archetypeOrder.map(id => {
    const a = RS.archetypes[id], ok = archs.includes(id);
    return `<button class="pick" data-pick="arch" data-id="${id}" style="--pc:${a.color}"
      aria-pressed="${S.archetype === id}" ${ok ? '' : 'disabled'}>
      <span class="pick-swatch"></span><span class="pick-body">
        <span class="pick-name">${esc(a.name)}</span>
        <span class="pick-blurb">${esc(a.grants)}</span></span></button>`;
  }).join('');

  const clsBtns = RS.classOrder.map(id => {
    const c = RS.classes[id], ok = cls.includes(id);
    const why = !race.allows.includes(id) ? `Closed to ${race.name}` : 'A different archetype';
    return `<button class="pick" data-pick="cls" data-id="${id}" style="--pc:${archColor(id)}"
      aria-pressed="${S.cls === id}" ${ok ? '' : 'disabled'} title="${ok ? esc(c.role) : esc(why)}">
      <span class="pick-swatch"></span><span class="pick-body">
        <span class="pick-name">${esc(c.name)}</span>
        <span class="pick-blurb">${esc(c.role)}</span></span></button>`;
  }).join('');

  const locked = RS.classOrder.filter(id => !race.allows.includes(id)).map(id => RS.classes[id].name);

  return `
  <div class="col col-funnel">
    <p class="legend">The funnel${NO_HOVER ? ' <button class="btn" id="funnelToggle" style="margin-left:auto">Done</button>' : ''}</p>
    <div class="step">
      <div class="step-head"><span class="step-rank">1</span><span class="step-name">Race</span>
        <span class="step-lv">at creation</span></div>
      <div class="pickers">${raceBtns}</div>
      ${locked.length ? `<p class="gate-note">${esc(race.name)} may not play: ${esc(locked.join(', '))}.</p>` : ''}
    </div>
    <div class="step">
      <div class="step-head"><span class="step-rank">2</span><span class="step-name">Archetype</span>
        <span class="step-lv">level ${RS.archetypes[S.archetype] ? RS.archetypes[S.archetype].atLevel : 5}</span></div>
      <div class="pickers">${archBtns}</div>
    </div>
    <div class="step">
      <div class="step-head"><span class="step-rank">3</span><span class="step-name">Class</span>
        <span class="step-lv">level 10</span></div>
      <div class="pickers">${clsBtns}</div>
    </div>
    <p class="legend">Level</p>
    <div class="lvwrap">
      <span class="lvnum">${S.level}<small> / ${RS.budget.levelCap}</small></span>
      <input type="range" id="lv" min="1" max="${RS.budget.levelCap}" value="${S.level}" aria-label="Character level">
    </div>
  </div>`;
}

/* --- one line's tree: SVG branch lines behind, node cards on top --- */
function treeGridHtml(t, remaining, ids){
  const rows = rowsOf(t);
  const prac = practiceOf(t.id);
  const cx = col => col * 100 + 50;      // viewBox is 3 columns of 100
  const cy = row => row * 100 + 50;

  const edges = t.nodes.flatMap(nd => nd.requires.map(pid => {
    const p = nodeInTree(t, pid); if (!p) return '';
    const lit = ids.has(nd.id) && ids.has(pid);
    const dim = !lit && (nd.reqSkill > prac);
    return `<line x1="${cx(p.col)}" y1="${cy(p.row)}" x2="${cx(nd.col)}" y2="${cy(nd.row)}"
             class="${lit ? 'lit' : dim ? 'dim' : ''}" />`;
  })).join('');

  const cards = t.nodes.map(nd => {
    const st = nodeState(t, nd, ids, remaining);
    return `<button class="tnode ${st}" data-node="${nd.id}" data-tree="${t.id}"
              style="grid-column:${nd.col + 1};grid-row:${nd.row + 1}">
        <span class="tnode-name">${esc(nd.name)}</span>
        <span class="tnode-meta">
          ${nd.draft ? '<span class="tnode-draft">draft</span>' : '<span class="tnode-dot"></span>'}
          <span class="tnode-cost">${nd.cost}</span>
        </span>
      </button>`;
  }).join('');

  /* The waterline sits under the deepest tier practice has earned. */
  let water = '';
  const rowReq = r => Math.min(...t.nodes.filter(n => n.row === r).map(n => n.reqSkill));
  let last = -1;
  for (let r = 0; r < rows; r++) if (rowReq(r) <= prac) last = r;
  if (last < rows - 1)
    water = `<div class="waterline" style="top:calc(var(--rowh) * ${last + 1})"><span>practice ${prac}</span></div>`;

  const labels = Array.from({ length: rows }, (_, r) => `<div class="rowlab">${rowReq(r)}</div>`).join('');

  return `
  <div class="treegrid-wrap">
    <div class="rowlabels">${labels}</div>
    <div class="treegrid">
      <svg class="tedges" viewBox="0 0 300 ${rows * 100}" preserveAspectRatio="none" aria-hidden="true">${edges}</svg>
      ${cards}${water}
    </div>
  </div>`;
}

function treeSpentHtml(t){
  const ids = ownedSet();
  const s = t.nodes.reduce((a, n) => a + (ids.has(n.id) ? (+n.cost || 0) : 0), 0);
  return `<b>${s}</b>/${treeCost(t)}`;
}

function viewTrees(){
  const c = RS.classes[S.cls];
  if (!c) return viewBeam() + `<div class="col"><p class="empty">No class is legal for this race. Open Rules and widen a race’s allowances.</p></div>`;

  const remaining = budgetTotal() - spent();
  const ids = ownedSet(), color = archColor(S.cls);

  const treesHtml = classTrees().map(t => `
    <section class="tree" data-treeid="${t.id}" style="--tc:${color}">
      <header class="tree-head">
        <div class="tree-name">${esc(t.name)}<span class="tree-spent">${treeSpentHtml(t)}</span></div>
        <p class="tree-blurb">${esc(t.blurb)}</p>
      </header>
      <div class="practice">
        <span class="practice-lab">Practice</span>
        <input type="range" min="1" max="20" value="${practiceOf(t.id)}" data-prac="${t.id}"
               aria-label="${esc(t.name)} practice">
        <span class="practice-val">${practiceOf(t.id)}</span>
        <button class="practice-max" data-pracmax="${t.id}" title="Assume this line fully trained">20</button>
      </div>
      ${treeGridHtml(t, remaining, ids)}
      ${S.editing ? `<div class="addrow">
        <button class="btn" data-addnode="${t.id}" data-lane="1">+ Spine</button>
        <button class="btn" data-addnode="${t.id}" data-lane="0">+ Left</button>
        <button class="btn" data-addnode="${t.id}" data-lane="2">+ Right</button>
        <button class="btn" data-edittree="${t.id}">Line…</button>
      </div>` : ''}
    </section>`).join('');

  return viewBeam() + `
  <div class="frame">
    ${viewFunnel()}
    <div class="col">
      <p class="legend">${esc(c.name)} — three lines</p>
      <div class="trees">${treesHtml}</div>
    </div>
    ${viewSheet()}
  </div>
  ${viewFoot()}`;
}

function viewSheet(){
  const c = RS.classes[S.cls], race = RS.races[S.race];
  const st = stats(), sh = shape(), owned = ownedNodes();
  const total = budgetTotal(), sp = spent(), color = archColor(S.cls);

  const rows = owned
    .sort((a, b) => a.tree.name.localeCompare(b.tree.name) || a.node.row - b.node.row)
    .map(({ tree, node }) => `
      <div class="owned-row"><span class="ln"></span>
        <span class="nm">${esc(node.name)}</span>
        <span class="tr">${esc(tree.name)} · ${node.reqSkill}</span></div>`).join('');

  const bars = RS.shapeAxes.map(a => {
    const v = sh.axes[a] || 0;
    return `<div class="shape-row"><span class="shape-k">${esc(a)}</span>
      <div class="shape-bar"><div class="shape-fill" style="width:${(v / sh.max) * 100}%"></div></div>
      <span class="shape-v">${v}</span></div>`;
  }).join('');

  const drafts = owned.filter(x => x.node.draft).length;
  /* How much of each line is spine versus branch — the thing the shape is for. */
  const capstones = classTrees().filter(t => {
    const spineEnd = t.nodes.filter(n => n.col === 1).sort((a, b) => b.row - a.row)[0];
    return spineEnd && ownedSet().has(spineEnd.id);
  }).length;

  return `
  <div class="col col-sheet" style="--tc:${color}">
    <h2 class="sheet-name"><input id="charname" value="${esc(S.name)}" aria-label="Character name" spellcheck="false"></h2>
    <p class="sheet-sub">${esc(race.name)} ${esc(c.name)} · ${esc(RS.archetypes[c.archetype].name)} · level ${S.level}</p>
    <div class="stats">
      <div class="stat"><div class="stat-k">Health</div><div class="stat-v">${st.hp}</div></div>
      <div class="stat"><div class="stat-k">Mana</div><div class="stat-v">${st.mana}</div></div>
      <div class="stat"><div class="stat-k">Stamina</div><div class="stat-v">${st.stam}</div></div>
    </div>
    <p class="legend">Shape</p>
    <div class="shape">${bars}</div>
    <p class="legend">Unlocked · ${owned.length}</p>
    ${owned.length ? `<div class="owned-list">${rows}</div>`
      : `<p class="empty">Nothing bought yet. Raise a line’s practice, then start at the top of its spine.</p>`}
    <p class="legend">Reading</p>
    <div class="diag">
      ${sp > total ? `<span class="warn">Over budget by ${sp - total}.</span><br>`
                   : `<b>${total - sp}</b> points still to spend.<br>`}
      Spine ends reached: <b>${capstones}</b> of ${classTrees().length}.<br>
      At level <b>${RS.budget.levelCap}</b> you could own <b>${(() => {
        const cc = classTrees().reduce((a, t) => a + treeCost(t), 0);
        return cc ? Math.round(budgetTotal(RS.budget.levelCap) / cc * 100) : 0;
      })()}%</b> of this class.<br>
      ${drafts ? `<b>${drafts}</b> of these are draft content — treat the names as placeholders.<br>` : ''}
      Practice sets how deep you may reach, the path sets what you may reach it through, and the budget sets how much you may hold.
    </div>
  </div>`;
}

function viewFoot(){
  return `
  <div class="footbar">
    <button class="btn" id="editToggle" aria-pressed="${!!S.editing}">${S.editing ? '● Editing' : 'Edit mode'}</button>
    <button class="btn" id="rulesBtn">Rules…</button>
    <button class="btn primary" id="exportBtn">Export</button>
    <button class="btn" id="importBtn">Import</button>
    <button class="btn danger" id="resetBtn">Reset</button>
    <span class="foot-note">${S.editing ? 'Click any node to edit it' : 'Selling a node also sells everything below it'}</span>
  </div>`;
}

/* The eight directions that are pitches rather than builds. They used to be a
   tab each, which made the tab bar the widest thing on the page and buried the
   two tabs that actually do something. All eight now live on one page, which is
   also the only way to compare them by reading across. */
const DIRECTIONS = {
    lok: {
      eyebrow: 'Direction two · not built', h: 'Legends of Kesmai',
      lede: 'No classes, no trees, no points. You get good at a thing by doing that thing, and the only ceiling is the twenty every skill already has. Progression is knowledge, gear, and the map in your head — not a build.',
      cards: [
        ['What it keeps', 'Skill by use, exactly as sim/weapons.ts already does it. Death is expensive. A veteran is someone who knows where things are, not someone who allocated well.'],
        ['What it costs', 'No build identity. Given enough hours every character converges on the same one — which is, per MAGIC-OPTIONS.md §5, where this game accidentally sits today.'],

/* ============================================================
   LOADOUT SIMULATOR
   ============================================================ */
const SLOTS_PER_ROW = 12;

/* Which of the six colours a glyph gets, and its two initials. */
function glyphOf(node){
  const w = node.name.replace(/[^A-Za-z\s]/g, '').trim().split(/\s+/);
  return (w.length > 1 ? w[0][0] + w[1][0] : node.name.slice(0, 2)).toUpperCase();
}
function kindOf(node){
  const t = node.tags;
  if (t.includes('heal')) return 'heal';
  if (t.includes('defense') || t.includes('buff')) return 'defensive';
  if (t.includes('control') || t.includes('root') || t.includes('debuff') || t.includes('taunt')) return 'control';
  if (t.includes('mobility') || t.includes('stealth') || t.includes('utility') || t.includes('summon')) return 'utility';
  return 'damage';
}
const KIND_COLOR = { damage:'#c0563a', heal:'#3f9c46', defensive:'#4a6fc4', control:'#a049b8', utility:'#8a8f9c' };

/* An ability's combat numbers. Derived from its tier and tags unless the node
   carries its own `sim` override. */
function simStats(node){
  const C = RS.sim;
  const tier = Math.max(0, Math.min(5, node.row));
  const kind = kindOf(node);
  const t = node.tags;
  const mult = t.includes('burst') ? C.kindMult.burst
             : t.includes('area')  ? C.kindMult.area
             : t.includes('dot')   ? C.kindMult.dot
             : t.includes('leech') ? C.kindMult.leech
             : t.includes('sustain') ? C.kindMult.sustain
             : C.kindMult.other;
  const raw = Math.round((C.powerByTier[tier] ?? 12) * mult);
  const base = {
    kind,
    power: (kind === 'control' || kind === 'defensive' || kind === 'utility') ? 0
         : kind === 'heal' ? Math.round(raw * C.kindMult.heal) : raw,
    actionTime: C.actionByTier[tier] ?? 1,
    cooldown:   C.cooldownByTier[tier] ?? 0,
    dot: t.includes('dot'),
  };
  return { ...base, ...(node.sim || {}) };
}

/* Every ability the chosen class has concepts for — all three of its lines,
   regardless of what any tree build bought. This tab is about the loadout,
   not the progression. */
function simAbilities(){
  const c = RS.classes[S.sim.cls];
  if (!c) return [];
  return c.trees.map(treeById).filter(Boolean);
}
function simNodeById(id){
  for (const t of simAbilities()){ const n = nodeInTree(t, id); if (n) return { tree: t, node: n }; }
  return null;
}

/* ---------- runtime ----------
   Deliberately NOT in S: a run is not something to persist. */
let SIM = null;
let simTimer = null;

function simStart(){
  const bar = S.sim.bar.filter(Boolean);
  if (!bar.length) return;
  SIM = {
    t: 0, lockUntil: 0, cd: {}, log: [],
    dmg: 0, heal: 0, casts: 0, blocked: 0, busy: 0,
    hp: RS.sim.targetHp, debuffs: [], lastRound: 0,
  };
  SIM.wall = performance.now();
  simLog(0, 'Simulation started. Round is ' + RS.sim.roundMs + 'ms.', 'tick');
  simTimer = setInterval(simTick, 50);
  render();
}
function simStop(){
  if (simTimer) clearInterval(simTimer);
  simTimer = null;
  if (SIM) simLog(SIM.t, 'Stopped.', 'tick');
  const keep = SIM;
  SIM = null;
  render();
  return keep;
}
function simLog(t, msg, cls){
  if (!SIM) return;
  SIM.log.push({ t, msg, cls: cls || '' });
  if (SIM.log.length > 400) SIM.log.shift();
}

/* One frame. The clock runs in seconds; a round is roundMs. */
function simTick(){
  if (!SIM) return;
  /* Advance by REAL elapsed time, not by the interval's nominal 50ms — Chrome
     throttles a background tab to roughly one tick a second, which would run
     the whole simulation in slow motion and make every cooldown a lie.
     Backgrounding is handled by pausing outright (see visibilitychange below)
     rather than by capping the step, because a cap is just slow motion again. */
  const now = performance.now();
  const step = Math.max(0, (now - SIM.wall) / 1000);
  SIM.wall = now;
  SIM.t += step;
  if (SIM.t < SIM.lockUntil) SIM.busy += step;

  const roundLen = RS.sim.roundMs / 1000;
  const round = Math.floor(SIM.t / roundLen);
  if (round > SIM.lastRound){
    SIM.lastRound = round;
    /* Damage-over-time lands on the round boundary, like everything else. */
    for (const d of SIM.debuffs){
      if (d.perTick > 0 && SIM.hp > 0){
        const tickDmg = Math.round(d.perTick * d.stacks);
        SIM.hp = Math.max(0, SIM.hp - tickDmg);
        SIM.dmg += tickDmg;
        simLog(SIM.t, `${d.label} ticks for <b>${tickDmg}</b> (${d.stacks} stack${d.stacks>1?'s':''})`, 'tick');
      }
    }
  }
  SIM.debuffs = SIM.debuffs.filter(d => {
    if (SIM.t < d.until) return true;
    simLog(SIM.t, `${d.label} wears off`, 'effect');
    return false;
  });
  if (SIM.hp <= 0 && !SIM.done){
    SIM.done = true;
    simLog(SIM.t, `Target down at ${SIM.t.toFixed(1)}s.`, 'dmg');
  }
  paintSim();
}

/* Fire one slot. Both gates are checked here, and a refusal is logged rather
   than silently ignored — "why did nothing happen" is the question the whole
   tab exists to answer. */
function simFire(slotIndex){
  if (!SIM) return;
  const id = S.sim.bar[slotIndex];
  if (!id) return;
  const found = simNodeById(id); if (!found) return;
  const { node } = found;
  const st = simStats(node);

  if (SIM.t < SIM.lockUntil){
    SIM.blocked++;
    simLog(SIM.t, `${node.name} refused — still acting for ${(SIM.lockUntil - SIM.t).toFixed(1)}s`, 'blocked');
    return paintSim();
  }
  const until = SIM.cd[id] || 0;
  if (SIM.t < until){
    SIM.blocked++;
    simLog(SIM.t, `${node.name} refused — ${(until - SIM.t).toFixed(1)}s of cooldown left`, 'blocked');
    return paintSim();
  }

  SIM.casts++;
  SIM.lockUntil = SIM.t + st.actionTime;
  SIM.lockTotal = st.actionTime;   // needed to draw the action bar draining
  if (st.cooldown > 0) SIM.cd[id] = SIM.t + st.cooldown;

  if (st.kind === 'heal' && st.power){
    SIM.heal += st.power;
    simLog(SIM.t, `${node.name} heals for <b>${st.power}</b>`, 'dmg');
  } else if (st.power){
    const dealt = st.dot ? Math.round(st.power * 0.35) : st.power;
    SIM.hp = Math.max(0, SIM.hp - dealt);
    SIM.dmg += dealt;
    simLog(SIM.t, `${node.name} hits for <b>${dealt}</b>`, 'dmg');
  } else {
    simLog(SIM.t, `${node.name} — ${st.kind}, no direct damage`, '');
  }

  /* Anything the ability puts on the board shows up on the dummy. */
  for (const eid of effectsFor(node)){
    const ef = RS.effects[eid]; if (!ef) continue;
    const dur = RS.sim.dotRounds * (RS.sim.roundMs / 1000);
    const existing = SIM.debuffs.find(d => d.id === eid);
    if (existing){
      existing.stacks = Math.min(ef.maxStacks || 1, existing.stacks + 1);
      existing.until = SIM.t + dur; existing.dur = dur;
      /* A burst that merely applies the effect must not erase the tick rate a
         real damage-over-time ability already set on it. */
      if (st.dot) existing.perTick = Math.max(existing.perTick, Math.round(st.power * RS.sim.dotPerTick));
    } else {
      SIM.debuffs.push({
        id: eid, label: ef.label, hostile: !!ef.hostile, stacks: 1,
        until: SIM.t + dur, dur,
        perTick: st.dot ? Math.round(st.power * RS.sim.dotPerTick) : 0,
      });
    }
    simLog(SIM.t, `→ ${ef.label} applied`, 'effect');
  }

  const el = document.querySelector(`.slot[data-slot="${slotIndex}"]`);
  if (el){ el.classList.remove('fired'); void el.offsetWidth; el.classList.add('fired'); }
  paintSim();
}

/* Repaint only what moves. A full render 20 times a second would fight the
   drag handlers and lose the log's scroll position. */
function paintSim(){
  if (!SIM) return;
  const q = s => document.querySelector(s);
  const clock = q('#simClock'); if (clock) clock.textContent = SIM.t.toFixed(1) + 's';
  const hpPct = (SIM.hp / RS.sim.targetHp) * 100;
  const hf = q('#hpFill'); if (hf) hf.style.width = hpPct + '%';
  const hn = q('#hpNum'); if (hn) hn.textContent = SIM.hp.toLocaleString() + ' / ' + RS.sim.targetHp.toLocaleString();

  const dps = SIM.t > 0.2 ? SIM.dmg / SIM.t : 0;
  const idle = SIM.t > 0 ? Math.max(0, 100 - (SIM.busy / SIM.t) * 100) : 0;
  const set = (id, v) => { const e = q(id); if (e) e.textContent = v; };
  set('#ssDmg', SIM.dmg.toLocaleString());
  set('#ssDps', dps.toFixed(1));
  set('#ssCasts', SIM.casts + (SIM.blocked ? ' / ' + SIM.blocked + ' refused' : ''));
  const idleEl = q('#ssIdle');
  if (idleEl){ idleEl.textContent = idle.toFixed(0) + '%'; idleEl.classList.toggle('warn', idle > 25); }

  const db = q('#debuffs');
  if (db) db.innerHTML = SIM.debuffs.map(d => {
    const left = Math.max(0, d.until - SIM.t);
    return `<div class="debuff${d.hostile ? '' : ' friendly'}">
      <div class="debuff-n">${esc(d.label)}${d.stacks > 1 ? ' ×' + d.stacks : ''}</div>
      <div class="debuff-t">${left.toFixed(1)}s</div>
      <div class="debuff-bar" style="width:${(left / d.dur) * 100}%"></div></div>`;
  }).join('') || '<span style="font-family:var(--mono);font-size:10px;color:var(--parch-3)">no effects on the target</span>';

  const acting = SIM.t < SIM.lockUntil;
  document.querySelectorAll('.slot[data-slot]').forEach(el => {
    const i = +el.dataset.slot, id = S.sim.bar[i];
    el.classList.toggle('acting', acting && !!id);
    const cdEl = el.querySelector('.slot-cd'), numEl = el.querySelector('.slot-cdnum');
    if (!id || !cdEl) return;
    const until = SIM.cd[id] || 0, left = until - SIM.t;
    const found = simNodeById(id);
    const total = found ? simStats(found.node).cooldown : 0;
    if (left > 0 && total > 0){
      cdEl.style.height = (left / total) * 100 + '%';   // the darkness wipes down as it recovers
      if (numEl) numEl.textContent = left.toFixed(1);
      el.classList.remove('ready');
    } else {
      cdEl.style.height = '0%';
      if (numEl) numEl.textContent = '';
      el.classList.toggle('ready', !acting);
    }
  });

  const af = q('#actionFill');
  if (af){
    const lockLeft = Math.max(0, SIM.lockUntil - SIM.t);
    const total = SIM.lockTotal || 0;
    af.style.width = (lockLeft > 0 && total > 0) ? (lockLeft / total) * 100 + '%' : '0%';
  }
  const al = q('#actionLab');
  if (al) al.innerHTML = acting
    ? `<span style="color:var(--rust)">ACTING — ${(SIM.lockUntil - SIM.t).toFixed(1)}s until you may act again</span>`
    : `<span style="color:var(--innate)">READY</span>`;

  const lg = q('#simLog');
  if (lg){
    lg.innerHTML = SIM.log.slice(-120).map(l =>
      `<div class="lg ${l.cls}"><span class="lg-t">${l.t.toFixed(1)}</span><span class="lg-m">${l.msg}</span></div>`).join('');
    lg.scrollTop = lg.scrollHeight;
  }
}

/* ---------- the view ---------- */
function viewSim(){
  if (!S.sim) S.sim = { cls: 'mage', bar: new Array(SLOTS_PER_ROW).fill(null), rows: 1 };
  const want = S.sim.rows * SLOTS_PER_ROW;
  if (S.sim.bar.length !== want){
    const b = S.sim.bar.slice(0, want);
    while (b.length < want) b.push(null);
    S.sim.bar = b;
  }
  const c = RS.classes[S.sim.cls];
  const inBar = new Set(S.sim.bar.filter(Boolean));

  const classBtns = RS.classOrder.map(id => {
    const cc = RS.classes[id];
    return `<button class="cp" data-simcls="${id}" style="--pc:${archColor(id)}" aria-pressed="${S.sim.cls === id}">
      <span class="cp-n">${esc(cc.name)}</span><span class="cp-r">${esc(cc.role)}</span></button>`;
  }).join('');

  const palette = simAbilities().map(t => `
    <div class="pal-group" style="--tc:${archColor(S.sim.cls)}">
      <p class="pal-h">${esc(t.name)}</p>
      <div class="pal-items">
        ${t.nodes.slice().sort((a,b)=>a.row-b.row).map(nd => {
          const st = simStats(nd);
          return `<button class="pal-item${inBar.has(nd.id) ? ' inbar' : ''}" draggable="true"
                    data-pal="${nd.id}" title="${esc(nd.text)}">
            <span class="glyph" style="--gc:${KIND_COLOR[st.kind]}">${esc(glyphOf(nd))}</span>
            <span class="pal-n">${esc(nd.name)}</span>
            <span class="pal-m">${st.power ? st.power + ' pwr<br>' : ''}${st.cooldown ? st.cooldown + 's cd' : 'no cd'} · ${st.actionTime}s act</span>
          </button>`;
        }).join('')}
      </div>
    </div>`).join('');

  const rowsHtml = Array.from({ length: S.sim.rows }, (_, r) => `
    <div class="bar">
      ${Array.from({ length: SLOTS_PER_ROW }, (_, i) => {
        const idx = r * SLOTS_PER_ROW + i;
        const id = S.sim.bar[idx];
        const found = id ? simNodeById(id) : null;
        if (!found) return `<div class="slot empty" data-slot="${idx}"><span class="slot-key">${idx + 1}</span>+</div>`;
        const st = simStats(found.node);
        return `<button class="slot" data-slot="${idx}" title="${esc(found.node.name)} — ${esc(found.node.text)}">
          <span class="slot-key">${idx + 1}</span>
          <span class="glyph" style="--gc:${KIND_COLOR[st.kind]}">${esc(glyphOf(found.node))}</span>
          <span class="slot-n">${esc(found.node.name)}</span>
          <span class="slot-lock"></span><span class="slot-cd"></span><span class="slot-cdnum"></span>
        </button>`;
      }).join('')}
    </div>`).join('');

  const running = !!SIM;

  return `<div class="simwrap">

/* ---------- ability card ----------
   On a pointer it follows the cursor. On a touch screen there is no hover at
   all, so it is pinned to the bottom of the screen and driven by tapping. */
const tipEl = document.getElementById('tip');
const NO_HOVER = window.matchMedia('(hover:none)').matches || window.innerWidth <= 820;
let tapped = null;
function hideTip(){
  tipEl.classList.remove('on');
  tapped = null;
  document.querySelectorAll('.tnode.tapped').forEach(el => el.classList.remove('tapped'));
}
function showTip(t, node, state, x, y){
  const why = whyBlocked(t, node, state);
  const parent = node.requires.map(r => (nodeInTree(t, r) || {}).name).filter(Boolean).join(', ');
  tipEl.innerHTML = `
    <div class="t-name">${esc(node.name)}</div>
    <div class="t-meta">practice ${node.reqSkill} · costs ${node.cost}${parent ? ' · after ' + esc(parent) : ' · start of the line'}${node.draft ? ' · draft' : ''}</div>
    <div class="t-text">${esc(node.text)}</div>
    ${effectsFor(node).map(id => {
      const ef = RS.effects[id];
      return `<div class="t-eff${ef.hostile ? '' : ' friendly'}">
        <div class="t-eff-h">${esc(ef.label)}
          <span class="t-eff-m">${ef.maxStacks > 1 ? 'stacks to ' + ef.maxStacks : 'no stacks'}${ef.grounded ? '' : ' · not built yet'}</span>
        </div>
        <div class="t-eff-t">${esc(ef.text)}</div></div>`;
    }).join('')}
    ${node.tags.length ? `<div class="tags">${node.tags.map(g => `<span class="tag">${esc(g)}</span>`).join('')}</div>` : ''}
    ${why ? `<div class="t-why">${esc(why)}</div>`
          : NO_HOVER ? `<div class="t-why" style="color:var(--parch-3)">Tap again to ${state === 'owned' ? 'sell it back' : 'take it'}.</div>` : ''}`;
  tipEl.classList.add('on');
  const r = tipEl.getBoundingClientRect();
  const left = Math.min(x + 14, window.innerWidth - r.width - 10);
  const top = Math.min(y + 14, window.innerHeight - r.height - 10);
  tipEl.style.left = Math.max(8, left) + 'px';
  tipEl.style.top = Math.max(8, top) + 'px';
}

function openNodeEditor(treeId, nodeId, newLane){
  const t = treeById(treeId); if (!t) return;
  const isNew = !nodeId;
  let node;

  if (isNew){
    const col = +newLane;
    const lane = t.nodes.filter(x => x.col === col).sort((a, b) => a.row - b.row);
    const tail = lane[lane.length - 1];
    /* A new node continues its own lane; a brand new lane hangs off the spine. */
    const parent = tail || t.nodes.filter(x => x.col === 1).sort((a, b) => a.row - b.row)[Math.min(2, t.nodes.filter(x => x.col === 1).length - 1)];
    const row = tail ? tail.row + 1 : (parent ? parent.row + 1 : 0);
    node = {
      id: `${treeId}_n${Math.floor(Math.random() * 1e6).toString(36)}`,
      name: 'New ability', row, col,
      reqSkill: ROWS[Math.min(row, ROWS.length - 1)],
      cost: ROWCOST[Math.min(row, ROWCOST.length - 1)],
      requires: parent ? [parent.id] : [], tags: [], text: '', draft: true,
    };
  } else {
    node = nodeInTree(t, nodeId);
  }
  if (!node) return;

  const parentOpts = ['<option value="">— start of the line —</option>']
    .concat(t.nodes.filter(x => x.id !== node.id).map(x =>
      `<option value="${x.id}" ${node.requires[0] === x.id ? 'selected' : ''}>${esc(x.name)} (practice ${x.reqSkill})</option>`)).join('');

  modal(isNew ? 'Add ability' : 'Edit ability', `
    <div class="field"><label for="e_name">Name</label>
      <input type="text" id="e_name" value="${esc(node.name)}"></div>
    <div class="field"><label for="e_parent">Requires — you cannot take this without it</label>
      <select id="e_parent">${parentOpts}</select></div>
    <div class="field-row">
      <div class="field"><label for="e_req">Practice required</label>
        <input type="number" id="e_req" min="1" max="20" value="${node.reqSkill}"></div>
      <div class="field"><label for="e_cost">Budget cost</label>
        <input type="number" id="e_cost" min="0" max="99" value="${node.cost}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="e_col">Column</label>
        <select id="e_col">
          <option value="0" ${node.col === 0 ? 'selected' : ''}>Left branch</option>
          <option value="1" ${node.col === 1 ? 'selected' : ''}>Spine (centre)</option>
          <option value="2" ${node.col === 2 ? 'selected' : ''}>Right branch</option>
        </select></div>
      <div class="field"><label for="e_row">Tier (row, from the top)</label>
        <input type="number" id="e_row" min="0" max="11" value="${node.row}"></div>
    </div>
    <div class="field"><label for="e_text">What it does</label>
      <textarea id="e_text">${esc(node.text)}</textarea></div>
    <div class="field"><label for="e_tags">Tags — these drive the Shape bars</label>
      <input type="text" id="e_tags" value="${esc(node.tags.join(' '))}"></div>
    <div class="field"><label>Known tags</label>
      <div class="tags">${Object.keys(RS.tagWeights).map(k => `<span class="tag">${esc(k)}</span>`).join('')}</div></div>
    <div class="field"><label>Status</label>
      <div class="checks"><label><input type="checkbox" id="e_draft" ${node.draft ? 'checked' : ''}>
        Draft — invented scaffolding, not decided</label></div></div>
  `, `
    ${isNew ? '' : '<button class="btn danger" data-delnode>Delete</button>'}
    <button class="btn primary" data-savenode style="margin-left:auto">Save</button>
    <button class="btn" data-close>Cancel</button>`);

  host.querySelector('[data-savenode]').onclick = () => {
    node.name = host.querySelector('#e_name').value.trim() || 'Unnamed';
    node.reqSkill = Math.max(1, Math.min(20, +host.querySelector('#e_req').value || 1));
    node.cost = Math.max(0, +host.querySelector('#e_cost').value || 0);
    node.col = +host.querySelector('#e_col').value;
    node.row = Math.max(0, +host.querySelector('#e_row').value || 0);
    node.text = host.querySelector('#e_text').value.trim();
    node.tags = host.querySelector('#e_tags').value.split(/[\s,]+/).filter(Boolean);
    node.draft = host.querySelector('#e_draft').checked;
    const p = host.querySelector('#e_parent').value;
    node.requires = p && p !== node.id ? [p] : [];
    if (isNew) t.nodes.push(node);
    closeModal(); render();
  };
  const del = host.querySelector('[data-delnode]');
  if (del) del.onclick = () => {
    /* Reattach anything hanging off it to its own parent, so the tree stays connected. */
    const heir = node.requires[0] || null;
    t.nodes.forEach(x => {
      if (x.requires.includes(node.id)) x.requires = heir ? [heir] : [];
    });
    t.nodes = t.nodes.filter(x => x.id !== node.id);
    S.owned = S.owned.filter(id => id !== node.id);
    closeModal(); render();
  };
}

/* ---------- export / import ---------- */
function buildMarkdown(){
  const c = RS.classes[S.cls], race = RS.races[S.race], st = stats(), sh = shape();
  const owned = ownedNodes(), total = budgetTotal(), sp = spent();
  const byTree = {};
  owned.forEach(({ tree, node }) => (byTree[tree.name] ||= []).push(node));

  const diffs = [];
  const D = DEFAULT_RULESET;
  if (JSON.stringify(RS.budget) !== JSON.stringify(D.budget))
    diffs.push(`- Budget curve is now base ${RS.budget.base}, +${RS.budget.perLevel}/level, cap ${RS.budget.levelCap} (was ${D.budget.base}/+${D.budget.perLevel}/${D.budget.levelCap}).`);
  RS.trees.forEach(t => {
    const d = D.trees.find(x => x.id === t.id);
    if (!d) return void diffs.push(`- New line **${t.name}**.`);
    if (d.nodes.length !== t.nodes.length) diffs.push(`- **${t.name}** now has ${t.nodes.length} abilities (was ${d.nodes.length}).`);
    t.nodes.forEach(nd => {
      const dn = d.nodes.find(x => x.id === nd.id);
      if (!dn) return void diffs.push(`- **${t.name}** — new ability *${nd.name}*.`);
      const ch = [];
      if (dn.name !== nd.name) ch.push(`renamed from *${dn.name}*`);
      if (dn.cost !== nd.cost) ch.push(`cost ${dn.cost}→${nd.cost}`);
      if (dn.reqSkill !== nd.reqSkill) ch.push(`practice ${dn.reqSkill}→${nd.reqSkill}`);
      if (dn.col !== nd.col || dn.row !== nd.row) ch.push(`moved to column ${nd.col}, tier ${nd.row}`);
      if (dn.requires.join() !== nd.requires.join()) ch.push('prerequisite changed');
      if (dn.text !== nd.text) ch.push('text rewritten');
      if (dn.tags.join(' ') !== nd.tags.join(' ')) ch.push(`tags → ${nd.tags.join(' ') || '(none)'}`);
      if (ch.length) diffs.push(`- **${t.name}** — *${nd.name}*: ${ch.join(', ')}.`);
    });
    if (d.ownerClasses.join() !== t.ownerClasses.join())
      diffs.push(`- **${t.name}** now belongs to ${t.ownerClasses.map(x => (RS.classes[x] || {}).name).filter(Boolean).join(', ') || '(nobody)'}.`);
  });
  RS.classOrder.forEach(id => {
    if (D.classes[id] && JSON.stringify(RS.classes[id]) !== JSON.stringify(D.classes[id]))
      diffs.push(`- Class **${RS.classes[id].name}** stats or lines changed.`);
  });
  RS.raceOrder.forEach(id => {
    if (D.races[id] && JSON.stringify(RS.races[id]) !== JSON.stringify(D.races[id]))
      diffs.push(`- Race **${RS.races[id].name}** changed (multipliers or class gating).`);
  });

  return `# Character Builder export — ${S.name}

**Direction:** Trees & Budget (DAoC)
**Build:** ${race.name} ${c.name} · ${RS.archetypes[c.archetype].name} · level ${S.level}
**Budget:** ${sp} of ${total} spent
**Stats:** ${st.hp} HP · ${st.mana} mana · ${st.stam} stamina

## Notes

${S.notes.trim() || '_(none)_'}

## Practice

${c.trees.map(id => { const t = treeById(id); return `- ${t ? t.name : id}: ${practiceOf(id)}`; }).join('\n')}

## Bought

${Object.keys(byTree).length
  ? Object.entries(byTree).map(([tn, ns]) =>
      `**${tn}**\n${ns.sort((a, b) => a.row - b.row).map(nd =>
        `- practice ${nd.reqSkill}, cost ${nd.cost}, ${nd.col === 1 ? 'spine' : nd.col === 0 ? 'left branch' : 'right branch'} — **${nd.name}**${nd.draft ? ' _[draft]_' : ''} — ${nd.text}`).join('\n')}`).join('\n\n')
  : '_(nothing bought)_'}

## Shape

${RS.shapeAxes.map(a => `- ${a}: ${sh.axes[a] || 0}`).join('\n')}

## Changed from defaults

${diffs.length ? diffs.join('\n') : '_(nothing — this is the shipped ruleset)_'}

## Full ruleset

\`\`\`json
${JSON.stringify(RS, null, 1)}
\`\`\`
`;
}

function openExport(){
  modal('Export', `

      <textarea id="x_notes" style="min-height:90px"
        placeholder="e.g. Fire's spine is too cheap at the bottom. The left branch on Arts should hang off Ambush, not Smoke. Ninja and Rogue still overlap.">${esc(S.notes)}</textarea></div>
    <p class="hint">One markdown file: your notes, this build, a plain-English list of everything you changed, and the whole ruleset as JSON. Paste it straight back into the chat.</p>
    <pre class="dump" id="x_dump"></pre>
  `, `<button class="btn" data-download>Download .md</button>
      <button class="btn primary" data-copy style="margin-left:auto">Copy to clipboard</button>
      <button class="btn" data-close>Close</button>`);

  const notes = host.querySelector('#x_notes'), dump = host.querySelector('#x_dump');
  const refresh = () => { S.notes = notes.value; dump.textContent = buildMarkdown(); save(); };
  notes.addEventListener('input', refresh); refresh();

  host.querySelector('[data-copy]').onclick = async (e) => {

  };
  host.querySelector('[data-download]').onclick = () => {
    const blob = new Blob([buildMarkdown()], { type: 'text/markdown' });

    a.href = URL.createObjectURL(blob);

function openImport(){
  modal('Import', `
    <div class="field"><label for="i_text">Paste an exported file, or just its JSON block</label>
      <textarea id="i_text" style="min-height:180px" spellcheck="false" placeholder="Paste here…"></textarea></div>
    <p class="hint">This replaces the whole ruleset. Your current build selection is cleared, because the abilities it referred to may not exist any more.</p>
  `, `<button class="btn primary" data-doimport style="margin-left:auto">Import</button>
      <button class="btn" data-close>Cancel</button>`);
  host.querySelector('[data-doimport]').onclick = () => {
    const raw = host.querySelector('#i_text').value;
    const fence = raw.match(/```json\s*([\s\S]*?)```/);
    let parsed;
    try { parsed = JSON.parse(fence ? fence[1] : raw); }
    catch { return void alert('That did not parse as JSON. Paste the whole exported file, or just the block between the ```json fences.'); }
    if (!parsed || !Array.isArray(parsed.trees) || !parsed.classes)
      return void alert('That JSON is missing `trees` or `classes`, so it is not a ruleset.');
    RS = migrate(parsed); S.owned = []; S.practice = {};
    closeModal(); render();
  };
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-pick],[data-node],[data-pracmax],[data-addnode],[data-edittree],[data-simcls],[data-pal],[data-slot],[data-simrows],#simRun,#simStop,#simClear,#funnelToggle,#editToggle,#rulesBtn,#exportBtn,#importBtn,#resetBtn,[data-close],[data-scrim]');
