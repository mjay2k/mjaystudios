<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/projectisles/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070a" />
    <title>Project Isles</title>
    <style>
      /*
        Boot splash. The app bundle is over a megabyte, so until it parses the
        browser has nothing to paint — which meant a blank page, then the game.
        This is plain HTML and CSS in the document head, so it is on screen at
        first paint, before a line of JavaScript runs.

        Sized and positioned to match the start screen's logo exactly, so the
        handoff is invisible: the same logo stays put and the menu fades in
        around it.
      */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070a;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        background: #05070a;
        transition: opacity 0.4s ease;
      }
      /*
        Mirrors .cc-frame in startscreen.css so both logos land in the same
        place and the handoff is a swap rather than a 100px jump: a block that
        grows to about the start screen's full height, centred in the viewport,
        with the wordmark at its top under the same padding. 890px is what that
        frame measures once its content is laid out. Keep the three shared
        numbers — height cap, top padding, and the logo sizing below — in step
        with that file.
      */
      #boot .boot-frame {
        margin: auto;
        width: 100%;
        height: min(100%, 890px);
        padding-top: clamp(14px, 2.6vh, 36px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      #boot img {
        /* Same rule as .cc-logo. */
        height: clamp(96px, 21vh, 181px);
        width: auto;
        max-width: 52vw;
      }
      @media (max-height: 620px) {
        #boot img {
          height: clamp(80px, 16vh, 120px);
        }
      }
      /* main.tsx sets this once React has painted. */
      body.app-ready #boot {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="/projectisles/assets/index-gDlyn4xe.js"></script>
    <link rel="stylesheet" crossorigin href="/projectisles/assets/index-OVm8It5K.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="boot-frame"><img src="/projectisles/brand/project-isles.png" alt="Project Isles" /></div>
    </div>
  </body>
</html>
